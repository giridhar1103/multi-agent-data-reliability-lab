[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-data-reliability-lab"
version = "0.1.0"
description = "Local, evidence-driven multi-agent data incident investigation and repair evaluation."
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.2,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=2,<4",
  "pydantic>=2.10,<3", "httpx>=0.27,<1", "sqlglot>=26,<31",
  "prometheus-client>=0.21,<1", "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "playwright>=1.50,<2", "pillow>=11,<13"]
[project.scripts]
reliability-lab = "reliability_lab.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
reliability_lab = ["static/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

